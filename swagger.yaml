openapi: 3.0.3
info:
  title: CargoFlow Logistics API
  version: 1.0.0
  description: API documentation for Shipment Management System

servers:
  - url: http://localhost:8000

tags:
  - name: Auth
  - name: Admin
  - name: Client
  - name: Agent
  - name: Chatbot
  - name: System

paths:

  /health:
    get:
      summary: Health Check
      tags: [System]
      responses:
        "200":
          description: API working
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

  # ---------------- AUTH ----------------

  /api/auth/register:
    post:
      summary: Register User
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
      responses:
        "201":
          description: User registered
        "400":
          description: Email already registered
        "422":
          description: Validation error

  /api/auth/login:
    post:
      summary: Login User
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        "200":
          description: Login success
        "401":
          description: Invalid credentials
        "403":
          description: Account blocked

  /api/auth/me:
    get:
      summary: Get current user
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User details

    patch:
      summary: Update user profile
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        "200":
          description: Profile updated

  # ---------------- ADMIN ----------------

  /api/v1/admin/dashboard:
    get:
      summary: Admin dashboard
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard data

  /api/v1/admin/dashboard/shipments:
    get:
      summary: Admin shipments dashboard
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Shipment statistics

  /api/v1/admin/dashboard/agents:
    get:
      summary: Admin agents dashboard
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Agents data

  /api/v1/admin/dashboard/clients:
    get:
      summary: Admin clients dashboard
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Clients data

  /api/v1/admin/shipments:
    post:
      summary: Create shipment (Admin)
      tags: [Admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminShipmentCreate'
      responses:
        "201":
          description: Shipment created
        "400":
          description: Invalid data
        "404":
          description: Client not found

  /api/v1/admin/shipments/{shipment_id}/assign/{agent_id}:
    post:
      summary: Assign agent to shipment
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: shipment_id
          in: path
          required: true
          schema:
            type: integer
        - name: agent_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Agent assigned successfully
        "404":
          description: Shipment or agent not found

  /api/v1/admin/delivery_agents:
    post:
      summary: Add delivery agent
      tags: [Admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryAgentCreate'
      responses:
        "201":
          description: Delivery agent created
        "400":
          description: Email already exists

  /api/v1/admin/delivery_agents/{agent_id}/status:
    patch:
      summary: Block or unblock delivery agent
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Status updated
        "404":
          description: Agent not found

  /api/v1/admin/business_clients:
    post:
      summary: Add business client
      tags: [Admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
      responses:
        "201":
          description: Business client created
        "400":
          description: Email already exists

  /api/v1/admin/agents/live-location:
    get:
      summary: Get live location of agents
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of agent locations

  # ---------------- CLIENT ----------------

  /api/v1/client/dashboard:
    get:
      summary: Client dashboard
      tags: [Client]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard data

  /api/v1/client/shipments:
    get:
      summary: Get client shipments
      tags: [Client]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Shipment list

    post:
      summary: Create shipment (Client)
      tags: [Client]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientShipmentCreate'
      responses:
        "201":
          description: Shipment created
        "400":
          description: Business required

  /api/v1/client/track/{tracking_id}:
    get:
      summary: Track shipment
      tags: [Client]
      parameters:
        - name: tracking_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tracking details
        "404":
          description: Invalid tracking ID

  /api/v1/client/business:
    post:
      summary: Create business
      tags: [Client]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessCreate'
      responses:
        "201":
          description: Business created
        "400":
          description: Already exists

    put:
      summary: Update business
      tags: [Client]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessCreate'
      responses:
        "200":
          description: Business updated
        "404":
          description: Business not found

  # ---------------- AGENT ----------------

  /api/v1/agent/dashboard:
    get:
      summary: Agent dashboard
      tags: [Agent]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard data

  /api/v1/agent/update/live-location:
    post:
      summary: Update agent live location
      tags: [Agent]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationUpdate'
      responses:
        "200":
          description: Location updated
        "403":
          description: Not assigned to shipment
        "404":
          description: Shipment not found

  # ---------------- CHATBOT ----------------

  /chat:
    post:
      summary: Ask chatbot a question
      tags: [Chatbot]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        "200":
          description: Chatbot response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        "400":
          description: Empty question
        "503":
          description: Model loading
        "500":
          description: Server error

  /chatbot/health:
    get:
      summary: Chatbot health check
      tags: [System]
      responses:
        "200":
          description: Health status

  /rebuild:
    post:
      summary: Rebuild chatbot knowledge base
      tags: [System]
      responses:
        "200":
          description: Rebuild successful
        "500":
          description: Rebuild failed

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    UserRegister:
      type: object
      required: [name, email, password, phone, city]
      properties:
        name: { type: string }
        email: { type: string }
        password: { type: string }
        phone: { type: string }
        city: { type: string }

    UserLogin:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    UserUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        password: { type: string }

    DeliveryAgentCreate:
      type: object
      required: [name, email, password, phone, city]
      properties:
        name: { type: string }
        email: { type: string }
        password: { type: string }
        phone: { type: string }
        city: { type: string }

    AdminShipmentCreate:
      type: object
      properties:
        sender_id: { type: integer }
        receiver_name: { type: string }
        receiver_phone: { type: string }
        receiver_email: { type: string }
        pickup_line1: { type: string }
        pickup_city: { type: string }
        pickup_state: { type: string }
        pickup_pincode: { type: string }
        delivery_line1: { type: string }
        delivery_city: { type: string }
        delivery_state: { type: string }
        delivery_pincode: { type: string }
        weight: { type: number }
        price: { type: number }

    ClientShipmentCreate:
      allOf:
        - $ref: '#/components/schemas/AdminShipmentCreate'

    LocationUpdate:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number }
        lng: { type: number }
        shipment_id: { type: integer }

    BusinessCreate:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string }

    ChatRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
        top_k:
          type: integer

    ChatResponse:
      type: object
      properties:
        question:
          type: string
        answer:
          type: string
        found_in_kb:
          type: boolean