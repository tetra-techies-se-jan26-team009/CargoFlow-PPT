openapi: 3.0.3
info:
  title: CargoFlow Logistics API
  version: 1.0.0
  description: >
    API documentation for Shipment Management System.

    USER STORIES & API MAPPING:

    Auth:
    - Register → User creates account
    - Login → User accesses system
    - Profile → User views/updates details

    Admin:
    - Dashboard → Monitor system
    - Shipments → Manage shipments
    - Agents → Manage delivery agents
    - Clients → Manage business clients

    Client:
    - Shipments → Create & view shipments
    - Tracking → Track deliveries
    - Business → Manage business profile

    Agent:
    - Dashboard → View assigned tasks
    - Location → Update delivery location

    Chatbot:
    - Chat → Ask shipment-related queries
    - Health → Check chatbot status
    - Rebuild → Refresh knowledge base

servers:
  - url: http://localhost:8000

tags:
  - name: Auth
  - name: Admin
  - name: Client
  - name: Agent
  - name: Chatbot
  - name: System

paths:

  # ---------------- SYSTEM ----------------

  /health:
    get:
      tags: [System]
      summary: Health Check
      description: "User Story: As a system admin, I want to check API health."
      responses:
        "200": { description: API working }

  # ---------------- AUTH ----------------

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register User
      description: "User Story: As a new user, I want to register."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
      responses:
        "201": { description: User registered }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login User
      description: "User Story: As a user, I want to login."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        "200": { description: Login success }

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get Profile
      description: "User Story: As a user, I want to view my profile."
      security:
        - bearerAuth: []
      responses:
        "200": { description: Profile data }

    patch:
      tags: [Auth]
      summary: Update Profile
      description: "User Story: As a user, I want to update my profile."
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        "200": { description: Profile updated }

  # ---------------- ADMIN ----------------

  /api/v1/admin/dashboard:
    get:
      tags: [Admin]
      summary: Admin Dashboard
      description: "User Story: As an admin, I want to view overall system metrics."
      security:
        - bearerAuth: []
      responses:
        "200": { description: Dashboard data }

  /api/v1/admin/dashboard/shipments:
    get:
      tags: [Admin]
      summary: Shipment Stats
      description: "User Story: As an admin, I want to view shipment statistics."
      security:
        - bearerAuth: []
      responses:
        "200": { description: Shipment data }

  /api/v1/admin/dashboard/agents:
    get:
      tags: [Admin]
      summary: Agent Stats
      description: "User Story: As an admin, I want to view agent performance."
      security:
        - bearerAuth: []
      responses:
        "200": { description: Agent data }

  /api/v1/admin/dashboard/clients:
    get:
      tags: [Admin]
      summary: Client Stats
      description: "User Story: As an admin, I want to view client data."
      security:
        - bearerAuth: []
      responses:
        "200": { description: Client data }

  /api/v1/admin/shipments:
    post:
      tags: [Admin]
      summary: Create Shipment
      description: "User Story: As an admin, I want to create shipments."
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminShipmentCreate'
      responses:
        "201": { description: Created }

  /api/v1/admin/shipments/{shipment_id}/assign/{agent_id}:
    post:
      tags: [Admin]
      summary: Assign Agent
      description: "User Story: As an admin, I want to assign agents."
      security:
        - bearerAuth: []
      parameters:
        - name: shipment_id
          in: path
          required: true
          schema: { type: integer }
        - name: agent_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Assigned }

  /api/v1/admin/delivery_agents:
    post:
      tags: [Admin]
      summary: Add Agent
      description: "User Story: As an admin, I want to add delivery agents."
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryAgentCreate'
      responses:
        "201": { description: Agent created }

  /api/v1/admin/delivery_agents/{agent_id}/status:
    patch:
      tags: [Admin]
      summary: Update Agent Status
      description: "User Story: As an admin, I want to block/unblock agents."
      security:
        - bearerAuth: []
      parameters:
        - name: agent_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Updated }

  /api/v1/admin/business_clients:
    post:
      tags: [Admin]
      summary: Add Client
      description: "User Story: As an admin, I want to add business clients."
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
      responses:
        "201": { description: Client added }

  /api/v1/admin/agents/live-location:
    get:
      tags: [Admin]
      summary: Agent Locations
      description: "User Story: As an admin, I want to monitor agent locations."
      security:
        - bearerAuth: []
      responses:
        "200": { description: Locations }

  # ---------------- CLIENT ----------------

  /api/v1/client/dashboard:
    get:
      tags: [Client]
      summary: Client Dashboard
      description: "User Story: As a client, I want to view my dashboard."
      security:
        - bearerAuth: []
      responses:
        "200": { description: Dashboard }

  /api/v1/client/shipments:
    get:
      tags: [Client]
      summary: View Shipments
      description: "User Story: As a client, I want to view my shipments."
      security:
        - bearerAuth: []
      responses:
        "200": { description: List }

    post:
      tags: [Client]
      summary: Create Shipment
      description: "User Story: As a client, I want to create shipments."
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientShipmentCreate'
      responses:
        "201": { description: Created }

  /api/v1/client/track/{tracking_id}:
    get:
      tags: [Client]
      summary: Track Shipment
      description: "User Story: As a client, I want to track shipments."
      parameters:
        - name: tracking_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Tracking }

  /api/v1/client/business:
    post:
      tags: [Client]
      summary: Create Business
      description: "User Story: As a client, I want to create business profile."
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessCreate'
      responses:
        "201": { description: Created }

    put:
      tags: [Client]
      summary: Update Business
      description: "User Story: As a client, I want to update business profile."
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessCreate'
      responses:
        "200": { description: Updated }

  # ---------------- AGENT ----------------

  /api/v1/agent/dashboard:
    get:
      tags: [Agent]
      summary: Agent Dashboard
      description: "User Story: As an agent, I want to view assigned tasks."
      security:
        - bearerAuth: []
      responses:
        "200": { description: Dashboard }

  /api/v1/agent/update/live-location:
    post:
      tags: [Agent]
      summary: Update Location
      description: "User Story: As an agent, I want to update live location."
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationUpdate'
      responses:
        "200": { description: Updated }

  # ---------------- CHATBOT ----------------

  /chat:
    post:
      tags: [Chatbot]
      summary: Chatbot Query
      description: "User Story: As a user, I want chatbot assistance."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        "200": { description: Response }

  /chatbot/health:
    get:
      tags: [System]
      summary: Chatbot Health
      description: "User Story: As an admin, I want to check chatbot status."
      responses:
        "200": { description: OK }

  /rebuild:
    post:
      tags: [System]
      summary: Rebuild KB
      description: "User Story: As an admin, I want to rebuild chatbot knowledge."
      responses:
        "200": { description: Rebuilt }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    UserRegister:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        password: { type: string }

    UserLogin:
      type: object
      properties:
        email: { type: string }
        password: { type: string }

    UserUpdate:
      type: object

    DeliveryAgentCreate:
      type: object

    AdminShipmentCreate:
      type: object

    ClientShipmentCreate:
      allOf:
        - $ref: '#/components/schemas/AdminShipmentCreate'

    LocationUpdate:
      type: object

    BusinessCreate:
      type: object

    ChatRequest:
      type: object

    ChatResponse:
      type: object